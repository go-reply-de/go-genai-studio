# SonarQube analysis scope for Go GenAI Studio. The project key and server come from the build.
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.*,**/*.test.*,**/__tests__/**,**/__mocks__/**,**/__test-utils__/**,**/test/**,e2e/**
sonar.exclusions=**/*.spec.*,**/*.test.*,**/__tests__/**,**/__mocks__/**,**/__test-utils__/**,**/test/**,e2e/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/locales/**,client/public/**,helm/**,k8s/minikube/**,.github/**,.devcontainer/**,.do/**
sonar.python.version=3
# The client's TypeScript program needs more than the default 2 GB heap.
sonar.javascript.node.maxspace=4096
