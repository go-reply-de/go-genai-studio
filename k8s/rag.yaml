apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rag
  name: rag
spec:
  replicas: ###_RAG_REPLICAS###
  selector:
    matchLabels:
      app: rag
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/env-config: "###_ENV_CHECKSUM###"
      labels:
        app: rag
    spec:
      containers:
        - env:
            - name: DB_HOST
              value: vectordb-###ENVIRONMENT###-service
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: librechat-credentials-env
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: librechat-credentials-env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: librechat-credentials-env
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  key: EMBEDDINGS_MODEL
                  name: env
            - name: EMBEDDINGS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  key: EMBEDDINGS_PROVIDER
                  name: env
            # Required when EMBEDDINGS_PROVIDER=openai
            - name: RAG_OPENAI_BASEURL
              valueFrom:
                configMapKeyRef:
                  key: RAG_OPENAI_BASEURL
                  name: env
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                configMapKeyRef:
                  key: RAG_OPENAI_API_KEY
                  name: env
            # Required when EMBEDDINGS_PROVIDER=vertexai - rag_api would
            # otherwise embed in us-central1. GOOGLE_CLOUD_PROJECT is left
            # unset on purpose: it falls back to the mounted key's project,
            # which is the public consumer project Vertex has to be billed to.
            - name: GOOGLE_CLOUD_LOCATION
              valueFrom:
                configMapKeyRef:
                  key: GOOGLE_CLOUD_LOCATION
                  name: env
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  key: JWT_REFRESH_SECRET
                  name: librechat-credentials-env
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: JWT_SECRET
                  name: librechat-credentials-env
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/sa_credentials.json
          image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.9.0
          resources:
            # Driven by k8s/profiles/*.env
            requests:
              cpu: "###_RAG_CPU###"
              memory: "###_RAG_MEMORY###"
          name: rag
          imagePullPolicy: Always
          volumeMounts:
            - name: gcp-service-account
              mountPath: /var/secrets/google
              readOnly: true
          ports:
            - containerPort: 8000
              protocol: TCP
      volumes:
      - name: gcp-service-account
        secret:
          secretName: gcp-service-account
          items:
          - key: key.json
            path: sa_credentials.json
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rag-###ENVIRONMENT###-service
  name: rag-###ENVIRONMENT###-service
spec:
  ports:
    - name: "8000"
      port: 8000
      targetPort: 8000
  selector:
    app: rag
