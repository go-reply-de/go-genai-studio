# Feedback review page at admin.<domain>/feedback/, on the regional load balancer
# behind the admin panel's IAP. Applied only where FEEDBACK_REVIEW_ENABLED is true
# (k8s/profiles). Runs the API image under its own service account, which may read
# the feedback tables and clean texts (setup repo, module feedback_review); the API
# itself may only add rows.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feedback-review
  namespace: ###_GKE_NAMESPACE###
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: feedback-review
  name: feedback-review
  namespace: ###_GKE_NAMESPACE###
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feedback-review
  template:
    metadata:
      labels:
        app: feedback-review
    spec:
      serviceAccountName: feedback-review
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: review
          image: ###LOCATION###-docker.pkg.dev/###PROJECT_ID###/###_REGISTRY_NAME###/api:###API_SHORT_SHA###
          command: ["node", "/app/api/feedback-review/server.js"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "###ENVIRONMENT###"
            - name: APP_TITLE
              value: "###APP_TITLE###"
            - name: FEEDBACK_DATASET
              valueFrom:
                configMapKeyRef:
                  key: FEEDBACK_DATASET
                  name: env
          readinessProbe:
            httpGet:
              path: /feedback/healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /feedback/healthz
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: feedback-review-gw
  name: feedback-review-gw
  namespace: ###_GKE_NAMESPACE###
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
  selector:
    app: feedback-review
---
# Only the load balancer's proxies and Google's health checks reach the pod, so no
# other workload can skip IAP and the reviewer header it sets can be trusted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feedback-review
  namespace: ###_GKE_NAMESPACE###
spec:
  podSelector:
    matchLabels:
      app: feedback-review
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: ###_PROXY_ONLY_CIDR###
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080
---
# A path on the admin panel's host, so no new certificate or DNS record; the
# more specific prefix wins over the admin panel's catch-all route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: feedback-review-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  parentRefs:
    - name: genai-studio-regional-###ENVIRONMENT###
      sectionName: https
  hostnames:
    - admin.###DOMAIN###
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /feedback
      backendRefs:
        - name: feedback-review-gw
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: feedback-review-gw-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /feedback/healthz
        port: 8080
  targetRef:
    group: ""
    kind: Service
    name: feedback-review-gw
---
# Same IAP client as the admin panel; the setup repo grants the reviewers access to
# this backend. A policy that fails to attach serves unauthenticated (see
# gateway-admin.yaml), so check it reports Attached after a first deploy.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: feedback-review-gw-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  default:
    timeoutSec: 60
    iap:
      enabled: true
      clientID: ###_IAP_CLIENT_ID###
      oauth2ClientSecret:
        name: iap-oauth-client-secret
  targetRef:
    group: ""
    kind: Service
    name: feedback-review-gw
