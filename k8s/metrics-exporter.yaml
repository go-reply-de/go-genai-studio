apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  labels:
    app: metrics-exporter
  namespace: ###_GKE_NAMESPACE###
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-exporter
  template:
    metadata:
      labels:
        app: metrics-exporter
    spec:
      containers:
      - name: metrics-exporter
        image: ghcr.io/virtuos/librechat_exporter:2.7.0
        imagePullPolicy: Always
        ports:
        - name: metrics-port
          containerPort: 8000
        env:
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              key: MONGO_URI
              name: env
        - name: LOGGING_LEVEL
          value: "info"
        # Day, week and month boundaries; the default is UTC.
        - name: METRICS_TIMEZONE
          value: "Europe/Berlin"
        # Token usage as the model reported it, from transactions, not just the typed text.
        - name: ENABLE_USAGE_WINDOW_METRICS
          value: "true"
        - name: USAGE_METRICS_TTL
          value: "60"
        # Ratings are counted by the API in BigQuery.
        - name: ENABLE_RATING_METRICS
          value: "false"
        - name: ENABLE_TOOL_METRICS
          value: "false"
        - name: ENABLE_BALANCE_METRICS
          value: "false"
        - name: ENABLE_FEATURE_METRICS
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-exporter-service
  labels:
    app: metrics-exporter
  namespace: ###_GKE_NAMESPACE###
spec:
  selector:
    app: metrics-exporter
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics-port

---
# This is the official GMP resource for configuring a scrape target.
# It tells the managed collector to find pods with the label 'app: metrics-exporter'
# and scrape the 'metrics-port' every 60 seconds.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: metrics-exporter-monitoring
  namespace: ###_GKE_NAMESPACE###
spec:
  selector:
    matchLabels:
      app: metrics-exporter
  endpoints:
  - port: metrics-port
    interval: 60s

