# Shared cache, rate-limit counters and resumable stream jobs for the api pods.
# Applied only where the rendered USE_REDIS is "true" - the "Deploy Redis" step
# in cloudbuild.yaml reads the same profile value the api pods get, so the
# client can never be switched on without its server.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
  name: redis
  namespace: ###_GKE_NAMESPACE###
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  # Two pods behind one Service would split the rate-limit counters and strand
  # in-flight stream jobs on whichever one is about to go away.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # An empty requirepass turns auth off, and a secret without a version
          # arrives here as "": refuse to start instead.
          command:
            - sh
            - -c
            - '[ -n "$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is empty, refusing to start without auth" >&2; exit 1; }; exec docker-entrypoint.sh "$@" --requirepass "$REDIS_PASSWORD"'
            - redis
          args:
            - redis-server
            # No persistence: stream jobs hold generated answer text, which is
            # patient data. Nothing here may reach a disk or a Backup. It also
            # keeps the pod PVC-free, so it can reschedule onto any node.
            - --save
            - ""
            - --appendonly
            - "no"
            # The headroom below the memory request is what keeps eviction from
            # ever running: allkeys-lru is the safety valve, and if it does run
            # it drops a live stream. Alert on evicted_keys, not on memory.
            - --maxmemory
            - "###_REDIS_MAXMEMORY###"
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: librechat-credentials-env
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: librechat-credentials-env
          resources:
            # Driven by k8s/profiles/*.env
            requests:
              cpu: "###_REDIS_CPU###"
              memory: "###_REDIS_MEMORY###"
          ports:
            - containerPort: 6379
          # redis-cli exits 0 on a NOAUTH reply too, so check for the answer.
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      restartPolicy: Always
---
# Only the api pods reach Redis. It holds answer text while it streams and the
# ban and rate-limit counters, so no other workload may read or reset them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: ###_GKE_NAMESPACE###
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-service
  name: redis-service
  namespace: ###_GKE_NAMESPACE###
spec:
  ports:
    - name: "tcp"
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: ###_GKE_NAMESPACE###
spec:
  # Driven by k8s/profiles/*.env.
  minAvailable: ###_STORE_MIN_AVAILABLE###
  selector:
    matchLabels:
      app: redis
