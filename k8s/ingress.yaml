apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: genai-studio-managed-cert-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  domains:
    - ###DOMAIN###
    - admin.###DOMAIN###
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genai-studio-managed-ingress-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
  annotations:
    kubernetes.io/ingress.global-static-ip-name: ###IP_ADDRESS_ID###
    networking.gke.io/managed-certificates: genai-studio-managed-cert-###ENVIRONMENT###
    kubernetes.io/ingress.class: gce
    networking.gke.io/v1beta1.FrontendConfig: genai-studio-managed-ingress-###ENVIRONMENT###-frontend-config
spec:
  # Second certificate, IN ADDITION to the ManagedCertificate above. Rendered
  # only where the profile sets TLS_SECRET_NAME - today the sovereign
  # environments - and deleted outright everywhere else, because referencing a
  # Secret that does not exist in the cluster is not a no-op.
  #
  # The Secret is created by terraform (modules/iap/tls.tf in the setup repo)
  # from a UKSH-issued certificate. The load balancer picks between the two by
  # SNI against each certificate's own SANs, so both can be attached at once and
  # neither hostname needs the other's certificate to be ready. That is what
  # makes moving the real domain onto this load balancer a DNS change with no
  # TLS gap: a Google-managed certificate cannot be provisioned until DNS
  # already points here, but this one can be installed in advance.
  #
  # Flow style deliberately: the render step removes this by line, so the whole
  # block has to fit on one.
  tls: [{ secretName: ###_TLS_SECRET_NAME### }]
  rules:
    # Only resolves when the admin panel is deployed (admin_panel_enabled=true
    # in Terraform for this environment); otherwise this backend is unhealthy
    # but the rest of the ingress (main app on the primary domain) is unaffected.
    - host: admin.###DOMAIN###
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 3000
  defaultBackend:
    service:
      name: api-service
      port:
        number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: genai-studio-managed-ingress-###ENVIRONMENT###-frontend-config
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: "MOVED_PERMANENTLY_DEFAULT"
# The BackendConfig referenced by api-service and admin-service
# (genai-studio-managed-ingress-###ENVIRONMENT###-backend-config) is deliberately
# NOT defined here. Terraform owns it (terraform/modules/iap/iap.tf in the
# go-genai-studio-setup repo) because it carries the IAP configuration. Defining
# it here too would re-apply it without the iap block on every build and silently
# turn IAP off until the next terraform apply.
