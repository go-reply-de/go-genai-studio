apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: genai-studio-managed-cert-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  domains:
    - ###DOMAIN###
    - admin.###DOMAIN### ###_ADMIN_ONLY###
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genai-studio-managed-ingress-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
  annotations:
    kubernetes.io/ingress.global-static-ip-name: ###IP_ADDRESS_ID###
    networking.gke.io/managed-certificates: genai-studio-managed-cert-###ENVIRONMENT###
    kubernetes.io/ingress.class: gce
    networking.gke.io/v1beta1.FrontendConfig: genai-studio-managed-ingress-###ENVIRONMENT###-frontend-config
spec:
  # Second certificate ALONGSIDE the ManagedCertificate, rendered only where
  # terraform has published one (self_managed_tls = "serving") and deleted
  # outright otherwise - referencing a missing Secret is not a no-op. The LB picks by SNI against each cert's SANs,
  # so installing this one in advance makes a domain move a DNS change with no
  # TLS gap, which a Google-managed cert cannot do.
  #
  # Flow style on purpose: the render step deletes this by line.
  tls: [{ secretName: ###_TLS_SECRET_NAME### }]
  # Rendered only with the admin panel: a backend on a missing Service fails
  # the whole Ingress, so GKE stops syncing the load balancer.
  rules: ###_ADMIN_ONLY###
    - host: admin.###DOMAIN### ###_ADMIN_ONLY###
      http: ###_ADMIN_ONLY###
        paths: ###_ADMIN_ONLY###
          - path: / ###_ADMIN_ONLY###
            pathType: Prefix ###_ADMIN_ONLY###
            backend: ###_ADMIN_ONLY###
              service: ###_ADMIN_ONLY###
                name: admin-service ###_ADMIN_ONLY###
                port: ###_ADMIN_ONLY###
                  number: 3000 ###_ADMIN_ONLY###
  defaultBackend:
    service:
      name: api-service
      port:
        number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: genai-studio-managed-ingress-###ENVIRONMENT###-frontend-config
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: "MOVED_PERMANENTLY_DEFAULT"
# The BackendConfig is deliberately NOT here: Terraform owns it
# (modules/iap/iap_global.tf) because it carries the IAP config. Defining it
# here too would re-apply it without the iap block and silently disable IAP.
