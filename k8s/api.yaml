apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: ###_GKE_NAMESPACE###
spec:
  replicas: ###_API_MIN_REPLICAS###
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "500m"
        gke-gcsfuse/memory-limit: "1Gi"
        gke-gcsfuse/ephemeral-storage-limit: "5Gi"
      labels:
        app: api
    spec:
      serviceAccountName: k8s-service-account
      initContainers:
        - name: copy-assets
          image: ###LOCATION###-docker.pkg.dev/###PROJECT_ID###/###_REGISTRY_NAME###/api:###API_SHORT_SHA###
          command: ["/bin/sh", "-c"]
          args:
            - >
              SENTINEL=/default-assets/.assets-version;
              WANT="###API_SHORT_SHA###";
              if [ ! -d /default-assets ]; then
                echo "Directory /default-assets not found, skipping.";
              elif [ "$(cat "$SENTINEL" 2>/dev/null)" = "$WANT" ]; then
                echo "Assets already at $WANT - skipping sync.";
              else
                echo "Syncing assets to $WANT...";
                find /default-assets -type f -not -name "main_logo.png" -not -name "main_favicon.png" -not -name ".assets-version" -delete &&
                cp -r -n /app/client/dist/assets/* /default-assets/ &&
                printf '%s' "$WANT" > "$SENTINEL" &&
                echo "Assets synced.";
              fi
          volumeMounts:
            - name: api-branding
              mountPath: /default-assets
      containers:
        - env:
            - name: ALLOW_EMAIL_LOGIN
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_EMAIL_LOGIN
                  name: env
            - name: ALLOW_PASSWORD_RESET
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_PASSWORD_RESET
                  name: env
            - name: ALLOW_REGISTRATION
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_REGISTRATION
                  name: env
            - name: ALLOW_SOCIAL_LOGIN
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_SOCIAL_LOGIN
                  name: env
            - name: ALLOW_SOCIAL_REGISTRATION
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_SOCIAL_REGISTRATION
                  name: env
            - name: ALLOW_UNVERIFIED_EMAIL_LOGIN
              valueFrom:
                configMapKeyRef:
                  key: ALLOW_UNVERIFIED_EMAIL_LOGIN
                  name: env
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  key: APP_TITLE
                  name: env
            - name: ADMIN_PANEL_URL
              valueFrom:
                configMapKeyRef:
                  key: ADMIN_PANEL_URL
                  name: env
            - name: ASSISTANTS_API_KEY
