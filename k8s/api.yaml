          image: ###LOCATION###-docker.pkg.dev/###PROJECT_ID###/###_REGISTRY_NAME###/api:###API_SHORT_SHA###
          resources:
            # Driven by k8s/profiles/*.env - see default.env for the rationale
            # and the ReadWriteOnce constraint that caps this deployment's replicas.
            requests:
              cpu: "###_API_CPU###"
              memory: "###_API_MEMORY###"
          name: ###_GKE_CLUSTER_NAME###
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /app/librechat.yaml
              name: config
              subPath: librechat.yaml
            - mountPath: /app/api/app/clients/tools/manifest.json
              name: plugin-manifest
              subPath: manifest.json
            - mountPath: /app/client/public/images
              name: api-images
            - mountPath: /app/uploads
              name: api-uploads
            - mountPath: /app/client/dist/assets
              name: api-branding
            - mountPath: /app/api/logs
              name: api-claim4
            - name: vertex-ai-sa-credentials
              mountPath: /app/api/data/auth.json
              subPath: auth.json
              readOnly: true
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: librechat.yaml
                path: librechat.yaml
            name: config
          name: config
        - configMap:
            items:
              - key: manifest.json
                path: manifest.json
            name: plugin-manifest
          name: plugin-manifest
        - name: api-images
          persistentVolumeClaim:
            claimName: api-images###_API_FILES_SUFFIX###
        - name: api-uploads
          persistentVolumeClaim:
            claimName: api-uploads###_API_FILES_SUFFIX###
        - name: api-branding
          persistentVolumeClaim:
            claimName: api-branding-pvc
        - name: api-claim4
          emptyDir: {}
        - name: vertex-ai-sa-credentials
          secret:
            secretName: gcp-service-account
            items:
              - key: key.json
                path: auth.json
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api-service
  name: api-service
  namespace: ###_GKE_NAMESPACE###
  annotations:
    cloud.google.com/backend-config: '{"default": "genai-studio-managed-ingress-###ENVIRONMENT###-backend-config"}'
    cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "neg-main-###ENVIRONMENT###"}}}'
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
  selector:
    app: api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-images
  name: api-images
  namespace: ###_GKE_NAMESPACE###
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-uploads
  name: api-uploads
  namespace: ###_GKE_NAMESPACE###
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Quoted: an unquoted ###...### parses as YAML null before rendering.
      storage: "###_UPLOADS_DISK###"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: api-branding-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 5Gi
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: ###_BRANDING_BUCKET_NAME###
  claimRef:
    name: api-branding-pvc
    namespace: ###_GKE_NAMESPACE###
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-branding-pvc
  namespace: ###_GKE_NAMESPACE###
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: api-branding-pv
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-service-account
  namespace: ###_GKE_NAMESPACE###
  annotations:
    iam.gke.io/gcp-service-account: ###_K8S_SA_EMAIL###
---
# Without this, a node drain can evict every api pod at once. maxUnavailable 1
# drains one at a time, so one keeps serving. Expressed as maxUnavailable rather
# than minAvailable so a single-replica environment can still be drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: ###_GKE_NAMESPACE###
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api
