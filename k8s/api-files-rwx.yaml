# OPTIONAL ReadWriteMany replacements for the api pod's file volumes, applied
# only when _API_FILES_MODE=rwx. Additive: these have DIFFERENT names from the
# RWO claims in api.yaml and _API_FILES_SUFFIX picks the pair, so switching
# either way is reversible and never deletes a bound claim.
#
# Why: RWO attaches to one node, capping the api Deployment at one replica.
#
# One bucket, two volumes separated by only-dir, because LibreChat uses two
# directories (paths.imageOutput, paths.uploads). NOT the branding bucket - the
# copy-assets initContainer runs `find ... -delete` over its root.
#
# After switching, the old api-images / api-uploads disks sit unused (~EUR 1.20
# /month each): safe to delete, safe to keep if you may switch back.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: api-images-rwx-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    # Ignored by GCS FUSE (object storage has no fixed size) but required by the
    # schema, and must be >= the claim's request.
    storage: 100Gi
  mountOptions:
    - implicit-dirs
    - only-dir=images
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: "###_API_FILES_BUCKET_NAME###"
  claimRef:
    name: api-images-rwx
    namespace: "###_GKE_NAMESPACE###"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-images
  name: api-images-rwx
  namespace: "###_GKE_NAMESPACE###"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: api-images-rwx-pv
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: api-uploads-rwx-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi
  mountOptions:
    - implicit-dirs
    - only-dir=uploads
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: "###_API_FILES_BUCKET_NAME###"
  claimRef:
    name: api-uploads-rwx
    namespace: "###_GKE_NAMESPACE###"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-uploads
  name: api-uploads-rwx
  namespace: "###_GKE_NAMESPACE###"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: api-uploads-rwx-pv
  storageClassName: ""
  volumeMode: Filesystem
