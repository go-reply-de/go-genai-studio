# OPTIONAL: ReadWriteMany replacements for the api pod's two file volumes.
#
# Applied by Cloud Build only when _API_FILES_MODE=rwx, which terraform sets from
# api_files_rwx = true. Nothing here replaces or mutates the default ReadWriteOnce
# claims in k8s/api.yaml - these use DIFFERENT names, and _API_FILES_SUFFIX
# decides which pair the pod mounts. So enabling or disabling this is reversible
# and never requires deleting a bound claim.
#
# WHY: ReadWriteOnce attaches to a single node, which caps the api Deployment at
# one replica - a second pod scheduled elsewhere cannot attach the disk. These
# volumes are shared, so the Deployment can run several.
#
# ONE BUCKET, TWO VOLUMES, separated by only-dir. LibreChat's local file strategy
# uses two directories - paths.imageOutput (served statically) and paths.uploads
# (served through the API) - so subdirectories of one bucket keep them apart
# without a second bucket to provision and grant.
#
# Deliberately NOT the branding bucket: the copy-assets initContainer runs
# `find <mount> -type f ... -delete` over that bucket's root, which would put user
# uploads inside the blast radius of an asset refresh.
#
# The api pod already carries gke-gcsfuse/volumes: "true", and the workload
# identity SA is granted roles/storage.objectUser on this bucket by
# terraform/modules/storage_bucket. No fsGroup is needed - the container runs as
# root, since Dockerfile.multi sets no USER.
#
# Leftover: after switching, the old api-images / api-uploads persistent disks sit
# unused (~EUR 1.20/month each). Safe to delete once you are satisfied, and safe
# to leave if you want the option of switching back.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: api-images-rwx-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    # Ignored by GCS FUSE (object storage has no fixed size) but required by the
    # schema, and must be >= the claim's request.
    storage: 100Gi
  mountOptions:
    - implicit-dirs
    - only-dir=images
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: "###_API_FILES_BUCKET_NAME###"
  claimRef:
    name: api-images-rwx
    namespace: "###_GKE_NAMESPACE###"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-images
  name: api-images-rwx
  namespace: "###_GKE_NAMESPACE###"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: api-images-rwx-pv
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: api-uploads-rwx-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi
  mountOptions:
    - implicit-dirs
    - only-dir=uploads
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: "###_API_FILES_BUCKET_NAME###"
  claimRef:
    name: api-uploads-rwx
    namespace: "###_GKE_NAMESPACE###"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: api-uploads
  name: api-uploads-rwx
  namespace: "###_GKE_NAMESPACE###"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: api-uploads-rwx-pv
  storageClassName: ""
  volumeMode: Filesystem
