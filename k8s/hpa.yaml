apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: ###_GKE_NAMESPACE###
  annotations:
    # Bounds come from k8s/profiles/*.env, and are capped by STORAGE not
    # capacity: while api-images is ReadWriteOnce it attaches to one node, so a
    # second pod sits Pending on FailedAttachVolume. Raising the ceiling before
    # moving that volume to RWX buys broken pods, not capacity.
    #
    # The target is a PERCENTAGE OF THE CPU REQUEST - at a 10m request, 80% was
    # 8m and the autoscaler pinned to max immediately. It has to move with
    # API_CPU in the other direction too: the api is a single Node process, so
    # it cannot reach 80% of a multi-core request and would never scale out.
    # Hence the profile-driven target below rather than a fixed 80.
    io.uksh.replica-bounds-source: "k8s/profiles/*.env"
spec:
  minReplicas: ###_API_MIN_REPLICAS###
  maxReplicas: ###_API_MAX_REPLICAS###
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: ###_API_HPA_TARGET_CPU###
        type: Utilization
    type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
