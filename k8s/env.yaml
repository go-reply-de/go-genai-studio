apiVersion: v1
data:
  ALLOW_EMAIL_LOGIN: "false"
  ALLOW_PASSWORD_RESET: "false"
  ALLOW_REGISTRATION: "false"
  ALLOW_SOCIAL_LOGIN: "true"
  ALLOW_SOCIAL_REGISTRATION: "true"
  ALLOW_UNVERIFIED_EMAIL_LOGIN: "false"
  AZURE_AI_SEARCH_API_VERSION: ""
  APP_TITLE: ###APP_TITLE###
  ADMIN_PANEL_URL: "https://admin.###DOMAIN###"
  ASSISTANTS_API_KEY: user_provided
  BAN_DURATION: 1000 * 60 * 60 * 2
  BAN_INTERVAL: "20"
  BAN_VIOLATIONS: "true"
  BINGAI_TOKEN: user_provided
  CHECK_BALANCE: "false"
  CONCURRENT_MESSAGE_MAX: "2"
  CONCURRENT_VIOLATION_SCORE: "1"
  CONSOLE_JSON: "false"
  DEBUG_CONSOLE: "false"
  DEBUG_LOGGING: "true"
  DEBUG_OPENAI: "false"
  DEBUG_PLUGINS: "true"
  DOMAIN_CLIENT: https://###DOMAIN###
  DOMAIN_SERVER: https://###DOMAIN###
  ENDPOINTS: "google, openAI, bingAI, agents"
  EMAIL_ALLOW_SELFSIGNED: ""
  EMAIL_ENCRYPTION: ""
  EMAIL_ENCRYPTION_HOSTNAME: ""
  EMAIL_FROM: noreply@gogenai.studio
  EMAIL_FROM_NAME: ""
  EMAIL_HOST: ""
  EMAIL_PASSWORD: ""
  EMAIL_PORT: "25"
  EMAIL_SERVICE: ""
  EMAIL_USERNAME: ""
  GOOGLE_CALLBACK_URL: /oauth/google/callback
  GOOGLE_MODELS: ###_GOOGLE_MODELS###
  GOOGLE_LOC: ###_GOOGLE_LOC###
  HELP_AND_FAQ_URL: https://www.reply.com/go-reply/en/
  HOST: 0.0.0.0
  ILLEGAL_MODEL_REQ_SCORE: "5"
  LDAP_BIND_CREDENTIALS: ""
  LDAP_BIND_DN: ""
  LDAP_CA_CERT_PATH: ""
  LDAP_SEARCH_FILTER: mail={{username}}
  LDAP_URL: ""
  LDAP_USER_SEARCH_BASE: ""
  LIMIT_CONCURRENT_MESSAGES: "true"
  LIMIT_MESSAGE_IP: "true"
  LIMIT_MESSAGE_USER: "false"
  LOGIN_MAX: "20"
  LOGIN_VIOLATION_SCORE: "1"
  LOGIN_WINDOW: "1"
  MEILI_HOST: http://meilisearch-service:7700
  MEILI_NO_ANALYTICS: "true"
  MESSAGE_IP_MAX: "40"
  MESSAGE_IP_WINDOW: "1"
  MESSAGE_USER_MAX: "40"
  MESSAGE_USER_WINDOW: "1"
  MESSAGE_VIOLATION_SCORE: "1"
  MONGO_URI: mongodb://mongodb-service:27017/LibreChat?directConnection=true
  NO_INDEX: "true"
  NON_BROWSER_VIOLATION_SCORE: "20"
  ANTHROPIC_API_KEY: user_provided
  AZURE_AI_SEARCH_API_KEY: user_provided
  OPENAI_MODERATION: "false"
  OPENAI_MODERATION_API_KEY: ""
  OPENAI_MODELS: "###_OPENAI_MODELS###"
  PORT: "80"
  PROXY: ""
  REFRESH_TOKEN_EXPIRY: (1000 * 60 * 60 * 24) * 7
  REGISTER_MAX: "5"
  REGISTER_WINDOW: "60"
  REGISTRATION_VIOLATION_SCORE: "1"
  SD_WEBUI_URL: http://host.docker.internal:7860
  SEARCH: "true"
  SESSION_EXPIRY: 1000 * 60 * 15
  AZURE_AI_SEARCH_SERVICE_ENDPOINT: ""
  AZURE_AI_SEARCH_INDEX_NAME: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_QUERY_TYPE: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_TOP: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_SELECT: ""
  RAG_API_URL: http://rag-###ENVIRONMENT###-service:8000
  # Derived together in cloudbuild.yaml from _RAG_SELF_HOSTED_EMBEDDINGS, not set
  # independently. provider=openai without RAG_CHECK_EMBEDDING_CTX_LENGTH=False
  # is silently wrong -- langchain would tokenize with tiktoken and send OpenAI
  # token ids to a model with a different vocabulary, which returns plausible
  # vectors that carry no meaning. Deriving them as a set makes that
  # combination unrepresentable.
  EMBEDDINGS_PROVIDER: ###_RAG_EMBEDDINGS_PROVIDER###
  EMBEDDINGS_MODEL: ###_RAG_EMBEDDINGS_MODEL###
  RAG_CHECK_EMBEDDING_CTX_LENGTH: "###_RAG_EMBEDDINGS_CHECK_CTX###"
  # Read only when EMBEDDINGS_PROVIDER is openai; empty and inert otherwise.
  # The key is not a credential -- the in-cluster model has no authentication --
  # but it has to be non-empty, and setting it explicitly stops a real
  # OPENAI_API_KEY from being sent to a local endpoint as the fallback.
  RAG_OPENAI_BASEURL: "###_RAG_EMBEDDINGS_BASEURL###"
  RAG_OPENAI_API_KEY: "###_RAG_EMBEDDINGS_API_KEY###"
  # Texts per embedding request. Self-hosted CPU inference is ~1.4 s per 1500
  # characters, so the upstream default of 200 would make a single request run
  # for minutes; smaller requests give the same throughput without that risk.
  EMBEDDINGS_CHUNK_SIZE: "###_RAG_EMBEDDINGS_CHUNK_SIZE###"
  # Vectors of different dimensions cannot share a collection: the column is an
  # unconstrained pgvector, so 1024-dim rows insert happily next to 768-dim
  # ones and the *read* fails with "different vector dimensions". Any change of
  # embedding model needs a new collection name and a re-index.
  COLLECTION_NAME: ###_RAG_COLLECTION_NAME###
  NODE_ENV: ###NODE_ENV###
  VERTEX_AI_DATASTORE_ID: "###_VERTEX_AI_DATASTORE_ID###"
  CUSTOM_FOOTER: "###_CUSTOM_FOOTER###"
kind: ConfigMap
metadata:
  labels:
    app: api-env
  name: env
