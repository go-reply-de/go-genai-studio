apiVersion: v1
data:
  ALLOW_EMAIL_LOGIN: "false"
  ALLOW_PASSWORD_RESET: "false"
  ALLOW_REGISTRATION: "false"
  ALLOW_SOCIAL_LOGIN: "true"
  ALLOW_SOCIAL_REGISTRATION: "true"
  ALLOW_UNVERIFIED_EMAIL_LOGIN: "false"
  AZURE_AI_SEARCH_API_VERSION: ""
  APP_TITLE: "###APP_TITLE###"
  ADMIN_PANEL_URL: "https://admin.###DOMAIN###"
  ASSISTANTS_API_KEY: user_provided
  BAN_DURATION: 1000 * 60 * 60 * 2
  BAN_INTERVAL: "20"
  BAN_VIOLATIONS: "true"
  BINGAI_TOKEN: user_provided
  CHECK_BALANCE: "false"
  CONCURRENT_MESSAGE_MAX: "2"
  CONCURRENT_VIOLATION_SCORE: "1"
  CONSOLE_JSON: "false"
  DEBUG_CONSOLE: "false"
  DEBUG_LOGGING: "true"
  DEBUG_OPENAI: "false"
  DEBUG_PLUGINS: "true"
  DOMAIN_CLIENT: "https://###DOMAIN###"
  DOMAIN_SERVER: "https://###DOMAIN###"
  ENDPOINTS: "google, openAI, bingAI, agents"
  EMAIL_ALLOW_SELFSIGNED: ""
  EMAIL_ENCRYPTION: ""
  EMAIL_ENCRYPTION_HOSTNAME: ""
  EMAIL_FROM: noreply@gogenai.studio
  EMAIL_FROM_NAME: ""
  EMAIL_HOST: ""
  EMAIL_PASSWORD: ""
  EMAIL_PORT: "25"
  EMAIL_SERVICE: ""
  EMAIL_USERNAME: ""
  GOOGLE_CALLBACK_URL: /oauth/google/callback
  GOOGLE_MODELS: "###_GOOGLE_MODELS###"
  GOOGLE_LOC: "###_GOOGLE_LOC###"
  HELP_AND_FAQ_URL: https://www.reply.com/go-reply/en/
  HOST: 0.0.0.0
  ILLEGAL_MODEL_REQ_SCORE: "5"
  LDAP_BIND_CREDENTIALS: ""
  LDAP_BIND_DN: ""
  LDAP_CA_CERT_PATH: ""
  LDAP_SEARCH_FILTER: mail={{username}}
  LDAP_URL: ""
  LDAP_USER_SEARCH_BASE: ""
  LIMIT_CONCURRENT_MESSAGES: "true"
  LIMIT_MESSAGE_IP: "true"
  LIMIT_MESSAGE_USER: "###_LIMIT_MESSAGE_USER###"
  LOGIN_MAX: "20"
  LOGIN_VIOLATION_SCORE: "1"
  LOGIN_WINDOW: "1"
  MEILI_HOST: http://meilisearch-service:7700
  MEILI_NO_ANALYTICS: "true"
  MESSAGE_IP_MAX: "###_MESSAGE_IP_MAX###"
  MESSAGE_IP_WINDOW: "1"
  MESSAGE_USER_MAX: "###_MESSAGE_USER_MAX###"
  MESSAGE_USER_WINDOW: "1"
  MESSAGE_VIOLATION_SCORE: "1"
  MONGO_URI: mongodb://mongodb-service:27017/LibreChat?directConnection=true
  NO_INDEX: "true"
  NON_BROWSER_VIOLATION_SCORE: "###_NON_BROWSER_VIOLATION_SCORE###"
  ANTHROPIC_API_KEY: user_provided
  AZURE_AI_SEARCH_API_KEY: user_provided
  OPENAI_MODERATION: "false"
  OPENAI_MODERATION_API_KEY: ""
  OPENAI_MODELS: "###_OPENAI_MODELS###"
  PORT: "80"
  PROXY: ""
  REFRESH_TOKEN_EXPIRY: (1000 * 60 * 60 * 24) * 7
  REGISTER_MAX: "5"
  REGISTER_WINDOW: "60"
  REGISTRATION_VIOLATION_SCORE: "1"
  SD_WEBUI_URL: http://host.docker.internal:7860
  SEARCH: "true"
  SESSION_EXPIRY: 1000 * 60 * 15
  AZURE_AI_SEARCH_SERVICE_ENDPOINT: ""
  AZURE_AI_SEARCH_INDEX_NAME: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_QUERY_TYPE: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_TOP: ""
  AZURE_AI_SEARCH_SEARCH_OPTION_SELECT: ""
  RAG_API_URL: "http://rag-###ENVIRONMENT###-service:8000"
  EMBEDDINGS_MODEL: "###_EMBEDDINGS_MODEL###"
  EMBEDDINGS_PROVIDER: "###_EMBEDDINGS_PROVIDER###"
  RAG_OPENAI_BASEURL: "###_RAG_OPENAI_BASEURL###"
  RAG_OPENAI_API_KEY: "###_RAG_OPENAI_API_KEY###"
  # rag_api defaults this to us-central1, which would embed document text in the
  # US. Deployment region, NOT GOOGLE_LOC: embeddings are served only from the
  # regional host, never from the eu multi-region behind PSC.
  #
  # ONLY wire this into rag.yaml. GeminiImageGen.js reads
  # GOOGLE_CLOUD_LOCATION || GOOGLE_LOC, in that order, so giving it to the api
  # pod - or switching any pod to envFrom - silently moves image generation off
  # the eu multi-region the PSC endpoint fronts.
  GOOGLE_CLOUD_LOCATION: "###LOCATION###"

  # --- Self-hosted inference tuning -------------------------------------------

  # VLLM_QUANTIZATION: leave EMPTY for unquantized BF16 (correct on H100 80GB).
  # "fp8" halves the weight footprint and is required to fit a 24GB L4.
  VLLM_QUANTIZATION: "fp8"

  # Context window served. NOT the model's maximum (Gemma 4 supports 256K) - it is
  # bounded by what is left of VRAM after the weights.
  VLLM_MAX_MODEL_LEN: "32768"

  # A full-32K sequence costs ~5.9 GiB of KV, so ~9 could run at maximum context
  # out of 54 GB. Real requests are far shorter and vLLM allocates blocks
  # dynamically, so 32 is a reasonable cap; it queues rather than thrashing.
  VLLM_MAX_NUM_SEQS: "32"

  # Fraction of each GPU vLLM may use. Everything not taken by weights becomes
  # KV cache, so on a memory-starved card this is the main lever.
  VLLM_GPU_MEM_UTIL: "0.95"

  # Directory name under the weights bucket, i.e. the basename of the upstream
  # repo id (BAAI/bge-m3 -> bge-m3).
  TEI_MODEL_NAME: "bge-m3"
  TRUST_PROXY: "###_TRUST_PROXY###"
  
  NODE_ENV: "###NODE_ENV###"
  VERTEX_AI_DATASTORE_ID: "###_VERTEX_AI_DATASTORE_ID###"
  CUSTOM_FOOTER: "###_CUSTOM_FOOTER###"
kind: ConfigMap
metadata:
  labels:
    app: api-env
  name: env
