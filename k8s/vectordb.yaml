apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vectordb-###ENVIRONMENT###
  name: vectordb-###ENVIRONMENT###
  namespace: ###_GKE_NAMESPACE###
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vectordb-###ENVIRONMENT###
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vectordb-###ENVIRONMENT###
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: librechat-credentials-env
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: librechat-credentials-env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: librechat-credentials-env
          image: ankane/pgvector:latest
          name: vectordb-###ENVIRONMENT###
          resources:
            # Driven by k8s/profiles/*.env
            requests:
              cpu: "###_VECTORDB_CPU###"
              memory: "###_VECTORDB_MEMORY###"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
              subPath: data
      restartPolicy: Always
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: vectordb-###ENVIRONMENT###-service
  name: vectordb-###ENVIRONMENT###-service
  namespace: ###_GKE_NAMESPACE###
spec:
  ports:
    - name: "tcp"
      port: 5432
      targetPort: 5432
  selector:
    app: vectordb-###ENVIRONMENT###
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: pgdata
  name: pgdata
  namespace: ###_GKE_NAMESPACE###
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Driven by k8s/profiles/*.env. Expansion is one-way; see default.env.
      storage: ###_VECTORDB_DISK###
